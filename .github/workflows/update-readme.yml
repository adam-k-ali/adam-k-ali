name: Update profile README

on:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh generated sections
        env:
          # Fine-grained PAT with read-only "Metadata" access to all your repos
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python3 scripts/update_readme.py
      - name: Commit changes
        run: |
          if git diff --quiet README.md; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh profile stats"
          git push
